<section class="pb-10 sm:pb-12 lg:pb-16">
  @for (time of timeLine(); track time.sprint) {
    @if ($odd) {
      <div class="flex flex-col lg:flex-row justify-between gap-0 lg:gap-0 mb-6 lg:mb-0">
        <img
          [ngSrc]="time.image"
          [alt]="time.alt"
          width="555"
          height="348"
          class="w-full lg:w-[555px] lg:shrink-0 lg:grow-0 h-auto object-cover"
        />
        <app-timeline-text
          [sprint]="time.sprint"
          [description]="time.description"
          class="card-wrapper"
        ></app-timeline-text>
      </div>
    } @else {
      <div class="flex flex-col lg:flex-row justify-between gap-0 lg:gap-0 mb-6 lg:mb-0">
        <app-timeline-text
          [sprint]="time.sprint"
          [description]="time.description"
          class="card-wrapper order-2 lg:order-1"
        ></app-timeline-text>
        <img
          [ngSrc]="time.image"
          [alt]="time.alt"
          width="555"
          height="348"
          class="w-full lg:w-[555px] lg:shrink-0 lg:grow-0 h-auto object-cover order-1 lg:order-2"
        />
      </div>
    }
  }
</section>
