<h2
  class="font-secondary font-bold text-4xl leading-none uppercase text-center text-black-marlin pb-16"
  #trigger
>
  Meet Our Team
</h2>
@defer (on viewport(trigger)) {
  <div class="flex justify-between pb-40">
    @for (member of memberSignal(); track member.name) {
      <app-team-card
        [image]="member.image"
        [alt]="member.alt"
        [name]="member.name"
        [position]="member.position"
        class="member-card"
        [style.animation-delay]="$index * 0.5 + 's'"
      ></app-team-card>
    }
  </div>
}
