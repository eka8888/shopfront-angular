<section class="flex pb-16 items-center">
  <img ngSrc="images/about/how-we-work.png" alt="How we work" width="555" height="443" />
  <div class="flex flex-col px-14 py-7 gap-[4%]">
    <h3 class="main-title">How we work</h3>
    @for (step of steps; track step.title) {
      <app-work-step [title]="step.title" [description]="step.description" class="pb-3" />
    }
  </div>
</section>
