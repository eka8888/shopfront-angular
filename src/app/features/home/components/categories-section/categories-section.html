<section class="m-auto py-20">
  <div class="flex justify-center gap-7.5">
    <!-- CATEGORY-CARD -->
    @for (category of categories(); track category.id) {
      @let categoryName = category.name['en-US'];

      <a routerLink="/shop" [queryParams]="{category: categoryName}" class="flex flex-col gap-5.75">
        <img [src]="category.image" [alt]="categoryName" />
        <h3
          class="text-black-marlin font-semibold text-lg leading-[133%] tracking-[0.06em] uppercase"
        >
          {{ categoryName }}
        </h3>
      </a>
    }
  </div>
</section>
