<!-- SORTING -->
<div class="max-w-56.25 ml-auto">
  <app-sorting-selector (sortSelect)="handleSelectSort($event)" />
</div>

<!-- CATALOG -->
<div class="grid grid-cols-[repeat(auto-fill,255px)] gap-x-7.5 gap-y-10 mt-7.5">
  @for (product of catalog() | productsSort: selectedSort(); track product.id) {
    <app-product-card [product]="product" (addToCart)="handleAddToCart($event)" />
  }
</div>
