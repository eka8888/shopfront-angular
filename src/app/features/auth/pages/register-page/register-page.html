<div class="bg-[#FAFAFA] min-h-screen py-20">
  <div
    class="max-w-[950px] mx-auto bg-white border border-[#E5E5E5] p-12"
  >
    <h1 class="text-[36px] font-medium mb-10">
      Create Account
    </h1>

    <form
      [formGroup]="registerForm"
      (ngSubmit)="register()"
    >
      <div class="grid grid-cols-2 gap-6">
        <app-input
          formControlName="firstName"
          label="First Name"
          placeholder="John"
          [required]="true"
          [error]="
            registerForm.controls.firstName.touched &&
            registerForm.controls.firstName.hasError('required')
              ? 'First name is required'
              : ''
          "
        />

        <app-input
          formControlName="lastName"
          label="Last Name"
          placeholder="Doe"
          [required]="true"
          [error]="
            registerForm.controls.lastName.touched &&
            registerForm.controls.lastName.hasError('required')
              ? 'Last name is required'
              : ''
          "
        />

        <app-input
          formControlName="email"
          [type]="InputType.Email"
          label="Email"
          placeholder="example@email.com"
          [required]="true"
          [error]="
            registerForm.controls.email.touched &&
            registerForm.controls.email.hasError('required')
              ? 'Email is required'
              : registerForm.controls.email.touched &&
                  registerForm.controls.email.hasError('email')
                ? 'Invalid email address'
                : ''
          "
        />

        <app-input
          formControlName="password"
          [type]="InputType.Password"
          label="Password"
          placeholder="Password"
          [required]="true"
          [error]="
            registerForm.controls.password.touched &&
            registerForm.controls.password.hasError('required')
              ? 'Password is required'
              : registerForm.controls.password.touched &&
                  registerForm.controls.password.hasError('minlength')
                ? 'Password must be at least'+minPasswordLength+' characters'
                : registerForm.controls.password.touched &&
                    registerForm.controls.password.hasError('passwordStrength')
                  ? 'Password must contain letters and numbers'
                  : ''
          "
        />

        <app-input
          formControlName="dateOfBirth"
          label="Date Of Birth"
          placeholder="YYYY-MM-DD"
          [required]="true"
          [error]="
            registerForm.controls.dateOfBirth.touched &&
            registerForm.controls.dateOfBirth.hasError('required')
              ? 'Date of birth is required'
              : registerForm.controls.dateOfBirth.touched &&
                  registerForm.controls.dateOfBirth.hasError('invalidDate')
                ? 'Invalid date'
                : registerForm.controls.dateOfBirth.touched &&
                    registerForm.controls.dateOfBirth.hasError('futureDate')
                  ? 'Date of birth cannot be in the future'
                  : ''
          "
        />

        <div class="col-span-2 mt-4">
          <h2 class="text-xl font-medium">
            Shipping Address
          </h2>
        </div>

        <app-select
          formControlName="country"
          label="Country"
          placeholder="Select Country"
          [required]="true"
          [options]="countries"
          [error]="
            registerForm.controls.country.touched &&
            registerForm.controls.country.hasError('required')
              ? 'Country is required'
              : ''
          "
        />

        <app-input
          formControlName="street"
          label="Street Address"
          placeholder="Address"
          [required]="true"
          [error]="
            registerForm.controls.street.touched &&
            registerForm.controls.street.hasError('required')
              ? 'Street address is required'
              : ''
          "
        />

        <app-input
          formControlName="city"
          label="City"
          placeholder="City"
          [required]="true"
          [error]="
            registerForm.controls.city.touched &&
            registerForm.controls.city.hasError('required')
              ? 'City is required'
              : ''
          "
        />

        <app-input
          formControlName="postalCode"
          label="Postal Code"
          placeholder="Postal Code"
          [required]="true"
          [error]="
            registerForm.controls.postalCode.touched &&
            registerForm.controls.postalCode.hasError('required')
              ? 'Postal code is required'
              : registerForm.controls.postalCode.touched &&
                  registerForm.controls.postalCode.hasError('invalidPostalCode')
                ? 'Invalid postal code for selected country'
                : ''
          "
        />

        <div class="col-span-2 mt-6">
          <label class="flex items-center gap-3 text-sm text-[#333333]">
            <input
              type="checkbox"
              formControlName="useSameAddressForBilling"
            />

            Use the same address for billing
          </label>
        </div>

        @if (!useSameAddressForBilling) {
          <div class="col-span-2 mt-4">
            <h2 class="text-xl font-medium">
              Billing Address
            </h2>
          </div>

          <app-select
            formControlName="billingCountry"
            label="Billing Country"
            placeholder="Select Country"
            [required]="true"
            [options]="countries"
            [error]="
              registerForm.controls.billingCountry.touched &&
              registerForm.controls.billingCountry.hasError('required')
                ? 'Billing country is required'
                : ''
            "
          />

          <app-input
            formControlName="billingStreet"
            label="Billing Street"
            placeholder="Billing address"
            [required]="true"
            [error]="
              registerForm.controls.billingStreet.touched &&
              registerForm.controls.billingStreet.hasError('required')
                ? 'Billing street is required'
                : ''
            "
          />

          <app-input
            formControlName="billingCity"
            label="Billing City"
            placeholder="Billing city"
            [required]="true"
            [error]="
              registerForm.controls.billingCity.touched &&
              registerForm.controls.billingCity.hasError('required')
                ? 'Billing city is required'
                : ''
            "
          />

          <app-input
            formControlName="billingPostalCode"
            label="Billing Postal Code"
            placeholder="Billing postal code"
            [required]="true"
            [error]="
              registerForm.controls.billingPostalCode.touched &&
              registerForm.controls.billingPostalCode.hasError('required')
                ? 'Billing postal code is required'
                : registerForm.controls.billingPostalCode.touched &&
                    registerForm.controls.billingPostalCode.hasError('invalidPostalCode')
                  ? 'Invalid billing postal code for selected country'
                  : ''
            "
          />
        }
      </div>

      @if (registerError) {
        <p class="text-red-500 text-sm mt-6">
          {{ registerError }}
        </p>
      }

      @if (isLoading) {
        <p class="text-sm text-[#6B6B6B] mt-6">
          Creating account...
        </p>
      }

      <div class="mt-10">
        <app-button
          [type]="ButtonType.Submit"
          [fullWidth]="true"
        >
          CREATE ACCOUNT
        </app-button>
      </div>

      <div class="text-center mt-6">
        <span class="text-sm text-[#6B6B6B]">
          Already have an account?
        </span>

        <a
          routerLink="/login"
          class="ml-2 uppercase tracking-[2px] text-sm font-medium"
        >
          Login
        </a>
      </div>
    </form>
  </div>
</div>
