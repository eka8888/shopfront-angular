<div class="fixed inset-0 flex items-center justify-center z-50">
  <button
    type="button"
    class="modal__backdrop"
    tabindex="-1"
    aria-hidden="true"
    (click)="close()"
  ></button>

  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal">
    <button class="modal__close" type="button" (click)="close()" aria-label="Close">
      <svg
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M1 1L15 15M15 1L1 15"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
    </button>

    <p class="modal__label">Clear Cart</p>
    <h2 id="modal" class="modal__title">Are you sure?</h2>
    <p class="modal__message">
      This will remove all items from your cart. This action cannot be undone.
    </p>

    <div class="modal__actions">
      <app-button [variant]="ButtonVariant.Outline" [type]="ButtonType.Button" (click)="close()">
        Cancel
      </app-button>
      <app-button [variant]="ButtonVariant.Dark" [type]="ButtonType.Button" (click)="confirm()">
        Clear Cart
      </app-button>
    </div>
  </div>
</div>
